# gopro_ros2: one service per supported ROS distro.
#
# Build an image:
#   docker compose build jazzy                 # or: noetic, humble (no service name builds all)
#
# Convert a video (DATA_DIR is mounted at /gopro_ws/data, defaults to ./data):
#   DATA_DIR=/path/to/videos docker compose run --rm jazzy \
#     ros2 launch gopro_ros2 gopro_to_rosbag.launch.py \
#       gopro_video:=/gopro_ws/data/GX010001.MP4 rosbag:=/gopro_ws/data/gopro_run
#
#   DATA_DIR=/path/to/videos docker compose run --rm noetic \
#     roslaunch gopro_ros2 gopro_to_rosbag.launch \
#       gopro_video:=/gopro_ws/data/GX010001.MP4 rosbag:=/gopro_ws/data/gopro_run.bag
#
# Interactive shell:
#   docker compose run --rm jazzy
#
# For display_images:=true, allow X11 access on the host first: xhost +local:docker

x-gopro-common: &gopro-common
  network_mode: host
  stdin_open: true
  tty: true
  environment:
    - DISPLAY=${DISPLAY:-}
    - QT_X11_NO_MITSHM=1
  volumes:
    # Input videos and output bags / EuRoC folders
    - ${DATA_DIR:-./data}:/gopro_ws/data
    # X11 socket, only needed for display_images:=true
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
  working_dir: /gopro_ws

services:
  noetic:
    <<: *gopro-common
    build:
      context: .
      dockerfile: docker/Dockerfile_ros1_20_04
    image: gopro_ros2:noetic

  humble:
    <<: *gopro-common
    build:
      context: .
      dockerfile: docker/Dockerfile_ros2_22_04
    image: gopro_ros2:humble

  jazzy:
    <<: *gopro-common
    build:
      context: .
      dockerfile: docker/Dockerfile_ros2_24_04
    image: gopro_ros2:jazzy
